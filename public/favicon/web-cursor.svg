<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Web line -->
  <g stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M14,10 Q8,4 3,-1"/>
    <path d="M15,8 Q10,2 6,-2"/>
    <path d="M16,6 Q14,0 10,-4"/>
  </g>
  <!-- Arm -->
  <path d="M20,26 L22,22 L22,12 L20,10 L18,10 L16,12 L14,14" fill="none" stroke="#cc1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="15" cy="15" r="4" fill="#cc1a1a"/>
  <!-- Web shooter on wrist -->
  <rect x="17" y="16" width="4" height="2.5" rx="1" fill="#ddd" stroke="#999" stroke-width="0.3"/>
  <!-- Fingers in shooting pose -->
  <g stroke="#cc1a1a" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Index and middle extended -->
    <path d="M12,12 Q8,6 7,2"/>
    <path d="M10,10 Q6,4 5,0"/>
    <!-- Ring and pinky curled -->
    <path d="M12,16 Q10,19 10,20"/>
    <path d="M14,17 Q14,20 13,21"/>
  </g>
</svg>
